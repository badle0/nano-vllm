name: CPU checks

on:
  pull_request:
    branches:
      - fork-main
  push:
    branches:
      - fork-main

permissions:
  contents: read

jobs:
  syntax-and-evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: python -m compileall -q nanovllm benchmarks tests

      - name: Validate historical request-metrics provenance
        run: python benchmarks/request_metrics/validate_provenance.py

      - name: Validate request-metrics certificate
        run: >-
          python benchmarks/request_metrics/validate_certification.py
          benchmarks/request_metrics/certification/2026-08-18-a100-b3efbdb/manifest.json

      - name: Validate sampling evidence
        run: python benchmarks/sampling_evidence/validate_provenance.py

      - name: Validate top-p evidence
        run: python benchmarks/topp_performance/evidence/validate_provenance.py

      - name: Validate streaming certificate
        run: python benchmarks/pr5_scripts/validate_repaired_stream_certificate.py

      - name: Validate retained chunk evidence
        run: >-
          python benchmarks/chunked_prefill_tail/validate_retained_evidence.py
          benchmarks/chunked_prefill_tail/evidence/2026-08-18-a100-contract-phase-e50e732
          benchmarks/chunked_prefill_tail/evidence/2026-08-18-a100-full-completion-ba1bde4

  speculative-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install standalone CPU test dependencies
        run: |
          python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "pytest>=8,<9" \
            "transformers==4.51.3" \
            "safetensors==0.5.3" \
            "numpy==1.26.4" \
            "xxhash==3.5.0" \
            "tqdm==4.67.1"

      - name: Verify maintained CPU contracts
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .github/ci/speculative_v2:.
          TRANSFORMERS_OFFLINE: "1"
        # The fail-on-construction Qwen shim makes this a CPU contract suite,
        # not a model/GPU certification. Historical speculative archive tests
        # live on the frozen experiment branch; no archive ancestry is needed.
        # The histogram module imports Triton before its CUDA skip marker, so
        # exclude that GPU-only module from this intentionally CPU-only job.
        run: >-
          python -m pytest -q -p no:cacheprovider
          --ignore=tests/test_topp_histogram.py
