name: CPU checks

on:
  pull_request:
    branches:
      - fork-main
  push:
    branches:
      - fork-main

permissions:
  contents: read

jobs:
  syntax-and-evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: python -m compileall -q nanovllm benchmarks tests

      - name: Validate historical request-metrics provenance
        run: python benchmarks/request_metrics/validate_provenance.py

      - name: Validate request-metrics certificate
        run: >-
          python benchmarks/request_metrics/validate_certification.py
          benchmarks/request_metrics/certification/2026-08-18-a100-b3efbdb/manifest.json

      - name: Validate sampling evidence
        run: python benchmarks/sampling_evidence/validate_provenance.py

      - name: Validate top-p evidence
        run: python benchmarks/topp_performance/evidence/validate_provenance.py

      - name: Validate streaming certificate
        run: python benchmarks/pr5_scripts/validate_repaired_stream_certificate.py

      - name: Validate retained chunk evidence
        run: >-
          python benchmarks/chunked_prefill_tail/validate_retained_evidence.py
          benchmarks/chunked_prefill_tail/evidence/2026-08-18-a100-contract-phase-e50e732
          benchmarks/chunked_prefill_tail/evidence/2026-08-18-a100-full-completion-ba1bde4

      - name: Validate retained speculative V2 evidence
        run: >-
          python benchmarks/speculative_v2/validate_retained_evidence.py
          benchmarks/speculative_v2/evidence/2026-08-28-a100-v2-d87f168/manifest.json

  speculative-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install standalone CPU test dependencies
        run: |
          python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "pytest>=8,<9" \
            "transformers==4.51.3" \
            "safetensors==0.5.3" \
            "numpy==1.26.4" \
            "xxhash==3.5.0" \
            "tqdm==4.67.1"

      - name: Verify exact speculative sampling law
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_speculative_sampler.py

      - name: Verify speculative V2 CPU contracts
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .github/ci/speculative_v2:.
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_config.py
          tests/test_gc_lifecycle.py
          tests/test_tokenizer_identity.py
          tests/test_loader.py
          tests/test_speculative_memory.py
          tests/test_llm_engine.py
          tests/test_model_runner.py
          tests/test_speculative_v0_golden.py
          tests/test_speculative_v2_lifecycle_harness.py
          tests/test_speculative_v2_gpu_recovery_harness.py
          tests/test_speculative_v2_retained_evidence.py
