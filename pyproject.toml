version = "0.3.0rc1"[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.3.0rc1"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn==2.8.1",
    "xxhash",
]

[project.optional-dependencies]
fast-sampling = [
    "flashinfer-python==0.6.17",
    "torch>=2.10,<2.11",
    "cuda-python>=12,<13",
]

[project.urls]
Homepage = "https://github.com/badle0/nano-vllm"
Upstream = "https://github.com/GeeeekExplorer/nano-vllm"
Issues = "https://github.com/badle0/nano-vllm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
